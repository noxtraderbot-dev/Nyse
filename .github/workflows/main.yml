      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build specifically for avernox without triggering root typecheck
      - name: Build project
        run: pnpm --filter avernox exec vite build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Ensure this path is where your build files are actually created
          publish_dir: ./artifacts/avernox/dist

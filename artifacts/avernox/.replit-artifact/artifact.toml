kind = "web"
previewPath = "/"
title = "AverNox TraderBot"
version = "1.0.0"
id = "artifacts/avernox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18641

[services.development]
run = "pnpm --filter @workspace/avernox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/avernox", "run", "build" ]
publicDir = "artifacts/avernox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18641"
BASE_PATH = "/"
